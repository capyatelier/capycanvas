# Independent validation oracle only; never part of an application graph.
[workspace]
[package]
name = "capy-portable-zstd-oracle"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[dependencies]
layer-core = { path = "../../../crates/layer-core" }
zstd = { version = "=0.13.3", default-features = false }
zrip-core = { version = "=0.10.1", default-features = false, features = ["std", "paranoid"] }
zrip-encode = { version = "=0.8.7", default-features = false, features = ["std", "paranoid"] }
zrip-decode = { version = "=0.8.7", default-features = false, features = ["std", "paranoid"] }
serde_json = "1"
sha2 = "=0.11.0"
[patch.crates-io]
zrip-core = { path = "../../../vendor/zrip-core" }
zrip-encode = { path = "../../../vendor/zrip-encode" }
