[package]
name = "layer-linux"
default-run = "layer-linux"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "layer-linux"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "capy-photo-reader"
path = "src/bin/capy-photo-reader.rs"
test = false
bench = false

[[test]]
name = "photo_reader"
path = "tests/photo_reader.rs"
harness = false

[features]
release-identity = []

[dependencies]
layer-core = { path = "../../crates/layer-core" }
layer-color = { path = "../../crates/layer-color" }
layer-render = { path = "../../crates/layer-render" }
layer-engine = { path = "../../crates/layer-engine" }
layer-host = { path = "../../crates/layer-host" }
layer-ui = { path = "../../crates/layer-ui" }
layer-workspace = { path = "../../crates/layer-workspace", features = ["native"] }
layer-render-wgpu = { path = "../../crates/layer-render-wgpu" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
pango = { version = "0.22", features = ["v1_56"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
serde_json = "1"
wgpu.workspace = true
libc = "0.2"
seccompiler = { version = "=0.5.0", default-features = false }
pollster = "0.4"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
raw-window-handle = "0.6"
glib = { version = "0.22", features = ["v2_72"] }
glib-unix = "0.22"
half = "2.7"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
layer-core = { path = "../../crates/layer-core", features = ["test-support"] }
layer-render-wgpu = { path = "../../crates/layer-render-wgpu", features = ["test-support"] }
png = "0.17.16"
rusqlite = "0.40.2"
