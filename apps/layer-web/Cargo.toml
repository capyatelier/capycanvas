[package]
name = "layer-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
layer-core = { path = "../../crates/layer-core" }
layer-engine = { path = "../../crates/layer-engine" }
layer-ui = { path = "../../crates/layer-ui" }
layer-render-wgpu = { path = "../../crates/layer-render-wgpu" }
wgpu = "30.0.1"
serde = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
console_error_panic_hook = "0.1"
