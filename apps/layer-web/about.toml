# Wasm distribution only. The repository-wide policy lives in /deny.toml.
# OpenEXR's exr/lebe dependencies use BSD-3-Clause; the packager includes their
# complete upstream notices, also recorded in THIRD_PARTY_NOTICES.md.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "CC0-1.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
targets = ["wasm32-unknown-unknown"]
ignore-dev-dependencies = true

# The decoder's archive omits LICENSE; use the original at its recorded Git
# revision, identical to the notice retained with our vendored core/encoder.
[zrip-decode.clarify]
license = "MIT"
[[zrip-decode.clarify.git]]
path = "LICENSE"
license = "MIT"
checksum = "c401ab3834bcd60cfaf717b5977d9ba89199f86e111375e0e268878fbb1cb221"

# exr ships both its own and the format project's original BSD notices in one
# file. Pin that complete file instead of substituting a generic license text.
[exr.clarify]
license = "BSD-3-Clause"
[[exr.clarify.files]]
path = "LICENSE.md"
license = "BSD-3-Clause"
checksum = "97e4d3aa7a9e8ac31979c16ca8bb2b628a9cb72c3362185ad2bf4ad77f43551f"

# profiling's crate archive omits the notice; retrieve it from that crate's
# recorded upstream Git revision and verify the original file's checksum.
[profiling.clarify]
license = "MIT OR Apache-2.0"
[[profiling.clarify.git]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "c8167fdeeed46d3f244d3f85c5bf998ce889343691c32be2c61a8bc4b5c08333"

# libm declares the complete library MIT at the start of LICENSE.txt. Its long
# contributor Apache section confuses automatic detection; retain the entire
# original file, including the math-library copyright notices at the end.
[libm.clarify]
license = "MIT"
[[libm.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "3823dda7cf046602f4b4e77ec8e227863dc4736037cc85bb33d9f19febe16bb7"

# TIFF's pinned JPEG decoder declares Zlib as an alternative. Its old archives
# omit the files; retrieve the original complete notice at the recorded commits.
# zune-core 0.4.12 and zune-inflate 0.2.54 also omit their repository field. package.mjs supplies its
# checksum-pinned original notice from licenses/ for that exact crate only.
[zune-jpeg.clarify]
license = "Zlib"
[[zune-jpeg.clarify.git]]
path = "LICENSE-ZLIB"
license = "Zlib"
checksum = "7fa429541e55b1509909e058f2d21a37467e4958ec713b357f6e0cf9dc4ee352"
