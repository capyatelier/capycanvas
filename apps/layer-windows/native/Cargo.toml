[package]
name = "layer-windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
layer-core = { path = "../../../crates/layer-core" }
layer-engine = { path = "../../../crates/layer-engine" }
layer-render = { path = "../../../crates/layer-render" }
layer-render-wgpu = { path = "../../../crates/layer-render-wgpu" }
layer-ui = { path = "../../../crates/layer-ui" }
layer-host = { path = "../../../crates/layer-host" }
serde_json = "1"
pollster = "0.4"
wgpu = "30.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Storage_FileSystem"] }
