[package]
name = "layer-windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
layer-core = { path = "../../../crates/layer-core" }
layer-engine = { path = "../../../crates/layer-engine" }
layer-render = { path = "../../../crates/layer-render", features = ["png"] }
layer-render-wgpu = { path = "../../../crates/layer-render-wgpu" }
layer-ui = { path = "../../../crates/layer-ui" }
layer-host = { path = "../../../crates/layer-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
wgpu = "30.0.1"

[dev-dependencies]
png = "0.17.16"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Storage_FileSystem", "Win32_System_WinRT", "Graphics_Imaging", "Storage", "Storage_Streams"] }
windows-future = "0.3.2"
