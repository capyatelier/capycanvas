[workspace]
members = [
    "crates/layer-core",
    "crates/layer-render",
    "crates/layer-engine",
    "crates/layer-render-wgpu",
    "crates/layer-ffi",
    "crates/layer-bench",
    "crates/layer-ui",
    "crates/layer-host",
    "apps/layer-linux",
    "apps/layer-web",
    "apps/layer-android/native",
    "apps/layer-apple/native",
    "apps/layer-windows/native",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
debug = 1

[profile.bench]
debug = 1

# Distribution keeps the normal speed optimizations, without native debug data.
[profile.web-release]
inherits = "release"
debug = 0
strip = "debuginfo"


# WGSL parsing and validation run during interactive startup. Keep application
# Rust debuggable while avoiding multi-second unoptimized shader compiler jobs.
[profile.dev.package.naga]
opt-level = 3
