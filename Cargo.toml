[workspace]
members = [
    "crates/layer-core",
    "crates/layer-color",
    "crates/layer-render",
    "crates/layer-engine",
    "crates/layer-render-wgpu",
    "crates/layer-ffi",
    "crates/layer-bench",
    "crates/layer-ui",
    "crates/layer-workspace",
    "crates/layer-host",
    "apps/layer-linux",
    "apps/layer-web",
    "apps/layer-android/native",
    "apps/layer-apple/native",
    "apps/layer-windows/native",
]
resolver = "2"
exclude = ["vendor/wgpu", "vendor/wgpu-hal", "vendor/wgpu-types", "vendor/image-webp", "vendor/rav1d", "vendor/rust_h265"]

# Explicit Wayland SDR image descriptions need Vulkan pass-through support.
# See vendor/README.md for the narrowly scoped patch and upstream provenance.
[patch.crates-io]
wgpu = { path = "vendor/wgpu" }
wgpu-hal = { path = "vendor/wgpu-hal" }
wgpu-types = { path = "vendor/wgpu-types" }
image-webp = { path = "vendor/image-webp" }
rav1d = { path = "vendor/rav1d" }
rust_h265 = { path = "vendor/rust_h265" }

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
debug = 1

[profile.bench]
debug = 1

# Distribution keeps the normal speed optimizations, without native debug data.
[profile.web-release]
inherits = "release"
debug = 0
strip = "debuginfo"


# WGSL parsing and validation run during interactive startup. Keep application
# Rust debuggable while avoiding multi-second unoptimized shader compiler jobs.
[profile.dev.package.naga]
opt-level = 3

# ICC LUT construction has large temporary tables before optimization. Keep
# the CMM optimized in debug apps too, including native file-worker stacks.
[profile.dev.package."moxcms:0.9.1"]
opt-level = 3
