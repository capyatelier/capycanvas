[advisories]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "Unmaintained stroke-recording serializer; replay decoding has length framing and a 64 KiB per-record limit. Serializer replacement remains separate work." },
    { id = "RUSTSEC-2024-0436", reason = "Unmaintained build-time proc macro used by pinned rav1d/rav1e; no runtime parser. Replace through maintained upstream dependencies." },
    { id = "RUSTSEC-2026-0459", reason = "Bundled SQLite before 3.54 can leak memory when it opens a crafted database with a -wal file written by another party; the workspace store opens only its own files in the app's data directory. The fix needs rusqlite 0.41, which Apple builds cannot link yet (see the rusqlite ban)." },
]

[bans]
deny = [
    { crate = "rusqlite@>=0.41", reason = "rusqlite 0.41 calls sqlite3_set_clientdata (SQLite 3.44). Apple builds link the system SQLite, which lacks it on iOS 17.5 to 18 and macOS 15, so the app fails to launch there. Bundle SQLite on Apple without its fstatfs calls before upgrading." },
]

# Source-repository policy: only explicitly reviewed permissive Rust licenses.
# Keep every platform in scope; do not restrict the dependency graph to Linux.
[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.95
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# rav1d uses this small extension-trait crate for typed conversions.
[[licenses.exceptions]]
name = "to_method"
version = "=1.1.0"
allow = ["CC0-1.0"]

# rav1e's cfg(fuzzing) dependency is included by the all-platform source audit.
# It is absent from production target graphs. NCSA is a permissive attribution
# license; keep this approval limited to the reviewed fuzz harness version.
[[licenses.exceptions]]
name = "libfuzzer-sys"
version = "=0.4.13"
allow = ["NCSA"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
