name: CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      rust-version:
        type: string
        default: "1.99.0"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: ${{ inputs.rust-version || '1.99.0' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tools/build -p 'test_android_*.py'
      - run: |
          python3 -m venv artifacts/visual-python
          artifacts/visual-python/bin/pip install -r tools/visual/requirements.txt
          artifacts/visual-python/bin/python -m unittest discover -s tools/visual -p 'test_*.py'
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown && rustup default "$RUST_VERSION"
      - run: cargo test --locked -p layer-core -p layer-engine -p layer-ui -p layer-workspace -p layer-color -p layer-render --features layer-workspace/native
      - run: cargo test --locked -p layer-host papers::tests::compat
      - run: |
          cargo test --locked -p layer-render-wgpu --lib -- \
            dry_material::tests::blend_specialization_accepts_lf_and_crlf_sources \
            dry_material::tests::every_kernel_entry_resolves_its_overrides \
            dry_material::tests::specialized_modules_omit_unreachable_features \
            destination_material::tests::transport_kernels_declare_the_workgroup_they_are_dispatched_with
      - run: cargo check --locked -p layer-web --target wasm32-unknown-unknown
      - run: python3 apps/layer-apple/scripts/project.py && git diff --exit-code
      - run: python3 -m unittest discover -s tools/git -p 'test_*.py'
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked
          command: check advisories licenses sources
