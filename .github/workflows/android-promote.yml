name: Promote Android testing release
on:
  workflow_dispatch:
    inputs:
      track:
        description: Select alpha after testing the final internal build; internal retries rollout without uploading
        required: true
        type: choice
        options: [alpha, internal]
permissions:
  contents: read
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version"
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" -q .status)
          test "$status" = identical || test "$status" = behind
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Promote the uploaded bundle and submit changes for review
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          VERSION: ${{ steps.version.outputs.version }}
          TRACK: ${{ inputs.track }}
        run: python3 tools/build/android_publish.py promote "$VERSION" "$TRACK"
