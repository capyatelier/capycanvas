name: Publish release updates
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: published-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: cloudflare
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/capycanvas-web
          path: target/capycanvas-web
          persist-credentials: false
          sparse-checkout: site/scripts/allow-downloads.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Publish the Flatpak update repository
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAPYCANVAS_WEB: ${{ github.workspace }}/target/capycanvas-web
        run: bash packaging/flatpak/publish.sh "$RELEASE_TAG"
