name: Windows readiness
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full source commit SHA (defaults to this workflow commit)
        required: false
        type: string
      fixtures:
        description: JSON array of registered fixture names
        required: false
        type: string
        default: '["vector-layers:default","vector-layers:light","vector-layers:ToolsOnly","vector-edges:default","vector-edges:light","idle-brush:default","idle-brush:light","touch-gestures:ThreeFinger","tool-bubbles:default","tool-bubbles:light-mouse","tool-bubbles:SlidersOnly","header:zen"]'
      runtime_run_id:
        description: Reuse the runtime artifact from a run with the same source_ref
        required: false
        type: string
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: never
  RUST_VERSION: "1.99.0"
jobs:
  windows-x64:
    if: ${{ inputs.runtime_run_id == '' }}
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: git rev-parse HEAD
      - run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --target x86_64-pc-windows-msvc
          rustup default $env:RUST_VERSION
      - name: Build native x64 Release for WARP fixtures
        run: ./apps/layer-windows/scripts/build.ps1 -Configuration Release -Architecture x64 -SoftwareAdapterTests -OutputDirectory artifacts/windows/SoftwareAdapter
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-readiness-runtime
          retention-days: 1
          path: |
            artifacts/windows/SoftwareAdapter/
            !artifacts/windows/SoftwareAdapter/**/*.pdb
            !artifacts/windows/SoftwareAdapter/**/*.obj
            !artifacts/windows/SoftwareAdapter/**/*.lib
            !artifacts/windows/SoftwareAdapter/**/*.exp
            !artifacts/windows/SoftwareAdapter/**/*.log
          if-no-files-found: error

  fixtures:
    needs: windows-x64
    if: ${{ !cancelled() && (needs.windows-x64.result == 'success' || inputs.runtime_run_id != '') }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        fixture: ${{ fromJSON(inputs.fixtures) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: git rev-parse HEAD
      - name: Set the private VM display size
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public static class CapyVmDisplay {
            const uint UseBitsPerPixel=0x40000, UseWidth=0x80000, UseHeight=0x100000, TestMode=2, Fullscreen=4;
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)]
            public struct Mode {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string DeviceName;
              public ushort SpecVersion, DriverVersion, Size, DriverExtra;
              public uint Fields;
              public int PositionX, PositionY;
              public uint Orientation, FixedOutput;
              public short Color, Duplex, YResolution, TTOption, Collate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string FormName;
              public ushort LogPixels;
              public uint BitsPerPixel, Width, Height, DisplayFlags, Frequency;
              public uint IcmMethod, IcmIntent, MediaType, DitherType, Reserved1, Reserved2, PanningWidth, PanningHeight;
            }
            [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            static extern bool EnumDisplaySettings(string device, int index, ref Mode mode);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)]
            static extern int ChangeDisplaySettingsEx(string device, ref Mode mode, IntPtr window, uint flags, IntPtr parameter);
            static Mode Current() {
              var mode = new Mode { Size=(ushort)Marshal.SizeOf(typeof(Mode)) };
              if (!EnumDisplaySettings(null, -1, ref mode)) throw new Win32Exception(Marshal.GetLastWin32Error());
              return mode;
            }
            public static void SetSize(uint width, uint height) {
              var best=new Mode();string available="";
              for(int index=0;;index++) {
                var candidate=new Mode { Size=(ushort)Marshal.SizeOf(typeof(Mode)) };
                if(!EnumDisplaySettings(null,index,ref candidate))break;
                available+=candidate.Width+"x"+candidate.Height+"@"+candidate.BitsPerPixel+" ";
                if(candidate.BitsPerPixel!=32||candidate.Width<1920||candidate.Height<1080||candidate.Width>width||candidate.Height>height)continue;
                candidate.Fields=UseBitsPerPixel|UseWidth|UseHeight;
                if(ChangeDisplaySettingsEx(null,ref candidate,IntPtr.Zero,TestMode,IntPtr.Zero)!=0)continue;
                if((ulong)candidate.Width*candidate.Height>(ulong)best.Width*best.Height)best=candidate;
              }
              if(best.Width==0)throw new InvalidOperationException("VM has no supported GUI fixture display of at least 1920x1080. Available: "+available);
              int result=ChangeDisplaySettingsEx(null,ref best,IntPtr.Zero,Fullscreen,IntPtr.Zero);
              if(result!=0)throw new InvalidOperationException("VM display mode rejected: "+result);
              var mode=Current();
              if(mode.Width!=best.Width||mode.Height!=best.Height)throw new InvalidOperationException("VM display size did not change");
              Console.WriteLine("VM display: "+mode.Width+"x"+mode.Height+", "+mode.BitsPerPixel+" bpp");
            }
          }
          '@
          [CapyVmDisplay]::SetSize(2560,1600)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-readiness-runtime
          path: artifacts/windows/SoftwareAdapter
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Native fixtures on private desktops
        env:
          LAYER_TEST_SOFTWARE_GPU: "1"
          CAPY_WAIT_SCALE: "3"
          FIXTURE_NAME: ${{ matrix.fixture }}
        run: |
          $executable = (Resolve-Path artifacts/windows/SoftwareAdapter/CapyCanvas.exe).Path
          $runner = (Resolve-Path tools/windows-vm/run-fixtures.ps1).Path
          $desktop = (Resolve-Path apps/layer-windows/scripts/test-desktop.ps1).Path
          $failed = [Collections.Generic.List[string]]::new()
          $names = @($env:FIXTURE_NAME)
          foreach ($name in $names) {
            if ($name -in @('idle-brush:default', 'idle-brush:light')) {
              $scale = $env:CAPY_WAIT_SCALE
              try {
                $env:CAPY_WAIT_SCALE = $null
                $idle = (Resolve-Path apps/layer-windows/scripts/exercise-idle-brush.ps1).Path
                $theme = if ($name -eq 'idle-brush:light') { 'light' } else { 'dark' }
                & $desktop -Script $idle -Parameters @{Executable=$executable; Theme=$theme; PresetIds=@(10,45,46,65,66,48,61,62,24,57,58,56,47,50,53,49,60,52,51,55)} -TimeoutSeconds 1800
              } catch {
                $failed.Add($name)
                Write-Warning "$name`: $_"
              } finally {
                $env:CAPY_WAIT_SCALE = $scale
              }
              continue
            }
            $output = Join-Path $env:GITHUB_WORKSPACE ('artifacts/windows/readiness/' + $name.Replace(':', '-'))
            try {
              & $desktop -Script $runner -Parameters @{Executable=$executable; Output=$output; Name=$name} -TimeoutSeconds 1320
              $plan = Get-Content (Join-Path $output 'plan.json') -Raw | ConvertFrom-Json
              $results = @(Get-Content (Join-Path $output 'results.jsonl') | ConvertFrom-Json)
              Write-Output "Expected: $($plan.runs -join ', ')"
              $results | Format-Table name, exit, seconds, message -AutoSize
              if (!(Test-Path (Join-Path $output 'complete'))) { throw 'Fixture runner did not complete.' }
              if (!$plan.runs.Count -or ($plan.runs -join ',') -cne ($results.name -join ',')) { throw 'Fixture results differ from the expected plan.' }
              if (@($results | Where-Object { $_.exit -ne 0 }).Count) { throw 'Fixture failed; inspect its result and evidence.' }
            } catch {
              $failed.Add($name)
              Write-Warning "$name`: $_"
              if (!(Test-Path (Join-Path $output 'plan.json'))) { throw }
            }
            $lightParameters = switch ($name) {
              'vector-layers:ToolsOnly' { @{Executable=$executable; ToolsOnly=$true; Theme='light'} }
              'touch-gestures:ThreeFinger' { @{Executable=$executable; ThreeFinger=$true; Theme='light'} }
              'tool-bubbles:SlidersOnly' { @{Executable=$executable; SlidersOnly=$true; Variant='light-mouse'} }
              'header:Catalog' { @{Executable=$executable; Catalog=$true; Theme='light'} }
            }
            if ($lightParameters) {
              $lightName = "$name light"
              try {
                Write-Output "Expected: $lightName"
                $lightScript = (Resolve-Path ("apps/layer-windows/scripts/exercise-" + ($name -split ':')[0] + '.ps1')).Path
                & $desktop -Script $lightScript -Parameters $lightParameters -TimeoutSeconds 1320
              } catch {
                $failed.Add($lightName)
                Write-Warning "$lightName`: $_"
              }
            }
          }
          if ($failed.Count) { throw "Failed fixtures: $($failed -join ', ')" }
      - name: Preserve app traces
        if: ${{ !cancelled() }}
        run: |
          $output = 'artifacts/windows/readiness/runtime-traces'
          New-Item -ItemType Directory -Force $output | Out-Null
          Get-ChildItem artifacts/windows/SoftwareAdapter -File | Where-Object { $_.Name -match '^(ui-state|camera-state|search-state|windows|prediction|latency)-|\.log$' } | Copy-Item -Destination $output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: windows-x64-readiness-${{ strategy.job-index }}
          retention-days: 7
          path: |
            artifacts/windows/
            !artifacts/windows/SoftwareAdapter/**
          if-no-files-found: warn
