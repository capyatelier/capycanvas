name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Release dry run' || 'Release' }} — ${{ github.ref_name }}
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows-packages-only:
        description: Build only the unsigned Windows packages
        default: false
        type: boolean
      source_ref:
        description: Full source SHA for a Windows-only package build
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || (inputs.windows-packages-only && format('windows-packages-{0}', inputs.source_ref || github.sha) || format('release-dry-run-{0}', github.ref)) }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.0"
  SIGNED: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
      rust: ${{ steps.version.outputs.rust }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.windows-packages-only && inputs.source_ref || github.sha }}
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rust=$RUST_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$SIGNED" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<NOTES'
            python3 - "$version" <<'PY'
          import sys, xml.etree.ElementTree as ET
          sys.path.insert(0, "tools/build")
          from android_publish import validate_notes
          notes = ET.parse("apps/layer-linux/art.capycanvas.CapyCanvas.metainfo.xml").find(f"releases/release[@version='{sys.argv[1]}']/description")
          if notes is None:
              sys.exit(f"Describe the {sys.argv[1]} release in the AppStream metainfo")
          text = lambda element: " ".join("".join(element.itertext()).split())
          notes = "\n\n".join(text(block) if block.tag == "p" else "\n".join(f"- {text(item)}" for item in block) for block in notes)
          validate_notes(notes)
          print(notes)
          PY
            echo NOTES
          } >> "$GITHUB_OUTPUT"
      - if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = "v$VERSION"
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" -q .status)
          test "$status" = identical || test "$status" = behind

  checks:
    if: ${{ !inputs.windows-packages-only }}
    needs: version
    uses: ./.github/workflows/release-checks.yml
    with:
      rust-version: ${{ needs.version.outputs.rust }}

  web:
    if: ${{ !inputs.windows-packages-only }}
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rust-docs --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          cargo install --locked wasm-bindgen-cli --version 0.2.128
          cargo install --locked cargo-about --version 0.9.2 --features cli
          cargo install --locked resvg --version 0.48.1
      - run: node apps/layer-web/package.mjs
      - run: cd dist && zip -qr "capycanvas-${{ needs.version.outputs.version }}-web.zip" capycanvas
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-package
          path: dist/*.zip
          if-no-files-found: error

  flatpak:
    if: ${{ !inputs.windows-packages-only }}
    needs: version
    runs-on: ubuntu-24.04
    environment: ${{ needs.version.outputs.publish == 'true' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y flatpak librsvg2-common zstd
      - name: Enable Flatpak build namespaces on the hosted runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bash packaging/flatpak/build.sh
      - if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.assets[] | select(.name | endswith("-flatpak-repository.tar.zst")) | .browser_download_url')
          if [[ -n "$previous" ]]; then
            curl --fail --location "$previous" -o "$RUNNER_TEMP/previous-flatpak.tar.zst"
            tar --zstd -xf "$RUNNER_TEMP/previous-flatpak.tar.zst" -C target/flatpak
          fi
      - env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ needs.version.outputs.publish == 'true' && secrets.FLATPAK_GPG_PRIVATE_KEY || '' }}
          FLATPAK_GPG_PASSPHRASE: ${{ needs.version.outputs.publish == 'true' && secrets.FLATPAK_GPG_PASSPHRASE || '' }}
          FLATPAK_GPG_FINGERPRINT: ${{ vars.FLATPAK_GPG_FINGERPRINT }}
        run: bash packaging/flatpak/export.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-package
          path: dist/flatpak/*
          if-no-files-found: error

  android:
    if: ${{ !inputs.windows-packages-only }}
    needs: version
    runs-on: ubuntu-24.04
    environment: ${{ needs.version.outputs.publish == 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rust-docs --target aarch64-linux-android
          rustup default "$RUST_VERSION"
          cargo install --locked cargo-ndk --version 4.1.2
          cargo install --locked cargo-about --version 0.9.2 --features cli
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Android debug and instrumentation builds and lint
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:lintRelease -PcapyAbi=arm64-v8a
        working-directory: apps/layer-android
      - if: env.SIGNED == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          base64 --decode <<< "${KEYSTORE:?}" > "$RUNNER_TEMP/upload.p12"
          echo "CAPY_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          echo "CAPY_UPLOAD_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:?}" >> "$GITHUB_ENV"
      - run: ./gradlew :app:bundleRelease -PcapyAbi=arm64-v8a
        working-directory: apps/layer-android
      - run: |
          mkdir dist
          mv apps/layer-android/app/build/outputs/bundle/release/app-release.aab "dist/capycanvas-${{ needs.version.outputs.version }}-android.aab"
      - name: Preserve the bundle before Play consumes its version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-bundle-package
          path: dist/*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: android-test-reports
          path: |
            apps/layer-android/app/build/reports
            apps/layer-android/app/build/outputs/apk/androidTest
          if-no-files-found: warn

  windows:
    needs: version
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            target: aarch64-pc-windows-msvc
    environment: ${{ needs.version.outputs.publish == 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.windows-packages-only && inputs.source_ref || github.sha }}
      - run: git rev-parse HEAD
      - run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component rust-docs --target ${{ matrix.target }}
          rustup default $env:RUST_VERSION
      - if: env.SIGNED == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - env:
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $sign = @{}
          if ($env:SIGNED -eq 'true') {
            az account get-access-token --scope https://codesigning.azure.net/.default --output none
            nuget install Microsoft.ArtifactSigning.Client -Version 1.0.128 -ExcludeVersion -OutputDirectory $env:RUNNER_TEMP | Out-Null
            $metadata = Join-Path $env:RUNNER_TEMP metadata.json
            @{ Endpoint = $env:ENDPOINT; CodeSigningAccountName = $env:ACCOUNT; CertificateProfileName = $env:PROFILE
               ExcludeCredentials = @('EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
                 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
                 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential') } |
              ConvertTo-Json | Set-Content $metadata
            $sign.SignArguments = '/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
              '/dlib', "$env:RUNNER_TEMP/Microsoft.ArtifactSigning.Client/bin/x64/Azure.CodeSigning.Dlib.dll", '/dmdf', $metadata
          }
          ./apps/layer-windows/scripts/package.ps1 -Architecture ${{ matrix.architecture }} @sign
          $portable = (Get-ChildItem artifacts/windows/distribution -Recurse -Filter result.json).FullName
          ./apps/layer-windows/scripts/package-msix.ps1 -PortableResultFile $portable
          $msix = (Get-ChildItem artifacts/windows/msix -Recurse -Filter result.json).FullName
          ./apps/layer-windows/scripts/test-msix.ps1 -ResultFile $msix
          ./apps/layer-windows/scripts/package-installer.ps1 -PortableResultFile $portable @sign
          $setup = (Get-ChildItem artifacts/windows/installer -Recurse -Filter result.json).FullName
          New-Item -ItemType Directory dist | Out-Null
          foreach ($result in @($portable, $msix)) { Copy-Item (Get-Content $result -Raw | ConvertFrom-Json).archive dist }
          Copy-Item (Get-Content $setup -Raw | ConvertFrom-Json).installer dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.architecture }}-package
          path: dist/*
          if-no-files-found: error

  apple:
    if: ${{ !inputs.windows-packages-only }}
    needs: version
    runs-on: macos-26
    environment: ${{ needs.version.outputs.publish == 'true' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ipad, mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-ios --target aarch64-apple-darwin
          rustup default "$RUST_VERSION"
          cargo install --locked cargo-about --version 0.9.2 --features cli
      - if: env.SIGNED == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          SIGNING_CERTIFICATE: ${{ matrix.platform == 'ipad' && secrets.APPLE_DEVELOPMENT_P12 || matrix.platform == 'mac' && secrets.APPLE_DEVELOPER_ID_P12 || '' }}
          SIGNING_PASSWORD: ${{ matrix.platform == 'ipad' && secrets.APPLE_DEVELOPMENT_PASSWORD || matrix.platform == 'mac' && secrets.APPLE_DEVELOPER_ID_PASSWORD || '' }}
          SIGNING_IDENTITY: ${{ matrix.platform == 'ipad' && 'Apple Development' || 'Developer ID Application' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: bash apps/layer-apple/scripts/import-signing.sh
      - run: apps/layer-apple/scripts/release.sh ${{ matrix.platform }}
      - if: matrix.platform == 'ipad'
        run: ditto -c -k --keepParent dist/apple-ipad/CapyCanvas-iPad.xcarchive dist/ipad-archive.zip
      - if: matrix.platform == 'ipad'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipad-archive
          path: dist/ipad-archive.zip
          if-no-files-found: error
      - if: matrix.platform == 'mac'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-package
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: apple-${{ matrix.platform }}-build-reports
          path: |
            dist/apple-${{ matrix.platform }}/archive.log
            dist/apple-${{ matrix.platform }}/dmg.log
            dist/apple-${{ matrix.platform }}/*.xcresult
          if-no-files-found: warn

  android-publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, checks, flatpak, web, android, windows, apple]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-bundle-package
          path: dist
      - if: env.SIGNED == 'true'
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Upload the preserved bundle as an internal draft
        if: env.SIGNED == 'true'
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: python3 tools/build/android_publish.py upload "$VERSION" "dist/capycanvas-$VERSION-android.aab"
      - if: env.SIGNED == 'true'
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          export JAVA_HOME="${JAVA_HOME_25_X64:?}"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 tools/build/android_apk.py download "$VERSION" "dist/capycanvas-$VERSION-android.apk"
      - if: env.SIGNED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk-package
          path: dist/*.apk
          if-no-files-found: error
      - name: Roll out the verified build to internal testers
        if: env.SIGNED == 'true'
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 tools/build/android_publish.py promote "$VERSION" internal

  ipad-publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, checks, flatpak, web, android, windows, apple]
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipad-archive
          path: dist
      - run: |
          mkdir -p dist/apple-ipad
          ditto -x -k dist/ipad-archive.zip dist/apple-ipad
      - env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          SIGNING_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_PASSWORD }}
          SIGNING_IDENTITY: Apple Development
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: bash apps/layer-apple/scripts/import-signing.sh
      - run: bash apps/layer-apple/scripts/release.sh ipad publish

  summary:
    if: ${{ always() }}
    needs: [version, checks, flatpak, web, android, windows, apple, android-publish, ipad-publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Record every job and the tested revision
        env:
          RESULTS: ${{ toJSON(needs) }}
          SOURCE_REF: ${{ inputs.windows-packages-only && inputs.source_ref || github.sha }}
          WINDOWS_PACKAGES_ONLY: ${{ inputs.windows-packages-only }}
        run: |
          mkdir report
          python3 - <<'PYCODE'
          import json, os, pathlib
          results = json.loads(os.environ['RESULTS'])
          publish = os.environ['SIGNED'] == 'true'
          excluded = 'Hardware required: renderer pixel/reference suites, GPU timestamp/timing and pipeline-cache qualification, native canvas UI journeys, physical pen/touch, HDR, device loss and performance. CPU models and Windows WARP tests do not qualify hardware rendering. Signing and store acceptance are exercised only by tag pushes.'
          report = {'commit': os.environ['SOURCE_REF'], 'workflow_commit': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF'], 'publish': publish, 'windows_packages_only': os.environ.get('WINDOWS_PACKAGES_ONLY', 'false') == 'true', 'jobs': {name: job['result'] for name, job in results.items()}, 'hardware_checks': excluded}
          pathlib.Path('report/results.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"{'Release' if publish else 'Release dry run'} at `{report['commit']}`\n\n| Job | Result |\n| --- | --- |\n")
              for name, result in report['jobs'].items():
                  summary.write(f'| {name} | {result} |\n')
              summary.write('\n' + excluded + '\n')
          PYCODE
      - if: needs.windows.result == 'success' && (inputs.windows-packages-only || (needs.apple.result == 'success' && needs.web.result == 'success' && needs.flatpak.result == 'success' && needs.android.result == 'success'))
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-package'
          path: report/packages
          merge-multiple: true
      - if: github.event_name == 'workflow_dispatch' && needs.apple.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipad-archive
          path: report/packages
      - run: |
          if [[ -d report/packages ]]; then (cd report/packages && sha256sum -- * > ../SHA256SUMS); fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: release-report
          path: |
            report/results.json
            report/SHA256SUMS
          if-no-files-found: error
      - name: Require successful checks and packages
        env:
          RESULTS: ${{ toJSON(needs) }}
          WINDOWS_PACKAGES_ONLY: ${{ inputs.windows-packages-only }}
        run: |
          python3 - <<'PYCODE'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          required = {'version', 'windows'} if os.environ.get('WINDOWS_PACKAGES_ONLY', 'false') == 'true' else set(results) - ({'android-publish', 'ipad-publish'} if os.environ['SIGNED'] != 'true' else set())
          sys.exit(any(results[name]['result'] != 'success' for name in required))
          PYCODE

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, summary]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-package'
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --notes "$NOTES" --generate-notes --title "Capy Canvas ${{ needs.version.outputs.version }}"
