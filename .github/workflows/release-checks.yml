name: Release checks
on:
  workflow_call:
    inputs:
      rust-version:
        required: true
        type: string
      windows-only:
        default: false
        type: boolean
      source_ref:
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      rust-version:
        default: '1.99.0'
        required: true
        type: string
      windows-only:
        description: Run only the existing x64 and ARM64 Windows release checks
        default: true
        type: boolean
      source_ref:
        description: Full source commit SHA (defaults to this workflow commit)
        required: false
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: never
  RUST_VERSION: ${{ inputs.rust-version }}
jobs:
  ci:
    if: ${{ !inputs.windows-only }}
    uses: ./.github/workflows/ci.yml
    with:
      rust-version: ${{ inputs.rust-version }}

  scripts:
    if: ${{ !inputs.windows-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - run: python3 -m pip install -r tools/visual/requirements.txt numpy
      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
      - name: Python unit tests
        run: |
          mkdir -p artifacts/release-tests
          failed=0
          for directory in tools/build tools/git tools/devices tools/windows-vm tools/visual tools/prediction tools/performance apps/layer-apple/tests; do
            python3 -m unittest discover -s "$directory" -p 'test_*.py' > "artifacts/release-tests/${directory//\//-}.log" 2>&1 || failed=1
            cat "artifacts/release-tests/${directory//\//-}.log"
          done
          exit "$failed"
      - name: Web unit tests
        if: ${{ !cancelled() }}
        run: node --test apps/layer-web/{run,package,frame,pointer,workspace-client,canvas-bar,notice,zoom-readout,export-controls,size-dialog,text-input,localization,numeric,histogram,workspace-manager-copy,toolbar-components-copy,color-controls-copy,document-color-copy,color-button-lifecycle,gpu-diagnostics,raster-worker-client,pipeline-wait}.test.mjs 2>&1 | tee artifacts/release-tests/web.log
      - name: Packaging, capture and report unit tests
        if: ${{ !cancelled() }}
        run: node --test apps/layer-linux/bench/window-capture.test.mjs tools/build/*.test.mjs tools/performance/windows-pen-report.test.mjs tools/cdp.test.mjs 2>&1 | tee artifacts/release-tests/node.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: script-test-reports
          path: artifacts/release-tests
          if-no-files-found: error

  renderer:
    if: ${{ !inputs.windows-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CAPY_STORAGE_DIR: ${{ github.workspace }}/artifacts/release-tests/profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          mkdir -p "$CAPY_STORAGE_DIR"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
      - name: Renderer CPU models and shader contracts
        run: |
          cargo test --locked --release -p layer-render-wgpu --lib -- \
            dry_material::tests::blend_specialization_accepts_lf_and_crlf_sources \
            dry_material::tests::every_kernel_entry_resolves_its_overrides \
            dry_material::tests::specialized_modules_omit_unreachable_features \
            destination_material::tests::transport_kernels_declare_the_workgroup_they_are_dispatched_with \
            pixel_transform::program_tests:: attached:: \
            bristle_table::tests:: brush_stamp::tests:: brush_tiles::tests:: builtin_masks:: \
            display_memory::tests:: effects::tests:: moving_projection::tests:: pixel_rect::tests:: \
            paint_transform::fine_demand:: paint_transform::region_batches:: \
            paint_transform::sampling::tests:: paint_transform::snapshot::tests:: \
            paint_transform::mesh::tests:: scene::metadata::tests:: scene::object_spatial::tests:: \
            scene::resample::program_tests:: scene::scale::graph::object_reuse_tests:: \
            startup::admission::tests:: startup::platform::tests:: \
            object_sampling::reference::tests:: retouch_sources::heal::tests:: \
            startup::tests::shader_document_ \
            startup::tests::brush_shader_key_ignores_color_and_size_but_tracks_pipeline_changes \
            startup::tests::dependencies_precede_speculation_and_promotions_compile_once \
            display_mips::tests::large_photo_display_plans_bound_pixels_without_changing_document_dimensions \
            object_sampling::tests::preflight_refuses_finite_mappings_that_cannot_form_gpu_source_coordinates \
            object_sampling::tests::nearest_coordinate_chunks_preserve_f64_boundaries_and_reject_unbounded_requests \
            object_sampling::tests::nearest_has_no_footprint_cap_but_checks_finite_linear_precision \
            object_sampling::tests::reference_stretch_agrees_with_independent_eigenvectors \
            tests::gpu_records_match_shader_layouts \
            tests::zoomed_out_previews_evaluate_paint_in_blocks_no_larger_than_a_surface_pixel \
            tests::clipped_empty_damage_never_visits_a_page \
            tests::pixel_rect_subtraction_preserves_every_pixel_outside_the_overlap \
            raster::native_tests::raster_capture_waits_share_the_selected_gpu_budget \
            --skip cached_gpu_startup_matches_eager_pixels_and_waits_for_catalog \
            --skip positions_grow_and_keep_their_texture_for_smaller_windows \
            2>&1 | tee artifacts/release-tests/renderer.log
      - name: Independent WebP and AVIF grid tests
        if: ${{ !cancelled() }}
        env:
          LAYER_WEBP_REFERENCES: ${{ github.workspace }}/artifacts/release-tests/webp
        run: |
          sudo apt-get update && sudo apt-get install -y libwebp7
          python3 tools/validation/webp_reference.py --output "$LAYER_WEBP_REFERENCES"
          cargo test --locked --release -p layer-color --lib -- \
            photo::raster_tests::external_webp_reference_samples \
            photo::gainmap::tests::avif_grid_preserves_partial_cells_alpha_and_gain_samples \
            --ignored --nocapture 2>&1 | tee artifacts/release-tests/codec-references.log
      - name: Apple bridge model tests
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --release -p layer-apple --lib -- \
            tests::header:: tests::toolbar_component:: tests::palette:: tests::workspace_motion:: tests::source:: \
            tests::workspace_request_starts_resumes_scene_and_closes \
            tests::color_raster_ffi_validates_buffer_and_matches_shared_spaces \
            tests::compact_color_circle_picking_uses_shared_shapes \
            tests::filter_property_edits_reset_and_undo_through_the_abi \
            tests::application_menu_hover_switches_only_an_open_neighbor_on_both_apple_platforms \
            tests::stateless_ tests::apple_ruler_toggles_flip_their_checkable_commands \
            tests::optional_gpu_timing_has_explicit_uninitialized_state_and_bounded_abi \
            tests::apple_color_hit_classifies_wheel_parts tests::apple_launch_ \
            tests::apple_native_boundaries_preserve_panic_diagnostics \
            tests::apple_language_publication_is_atomic_deferred_and_window_local \
            tests::ui_actions_change_only_the_addressed_apple_session \
            tests::storage_names_every_store_within_the_folders_it_is_given \
            tests::papers::apple_paper_library_import_reload_rename_delete_and_add_preserve_authored_history \
            tests::papers::apple_paper_preview_leases_outlive_the_editor_and_match_shared_pixels \
            tests::papers::apple_paper_worker_failure_retires_its_request_without_authored_changes \
            tests::papers::apple_initial_paper_is_prepared_before_publication_and_later_library_reload_does_not_enqueue_another_load \
            tests::papers::apple_failed_initial_material_notifies_once_and_reload_does_not_repeat_the_failed_default_request \
            --test-threads=1 2>&1 | tee artifacts/release-tests/apple-bridge.log
      - name: Android bridge tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --release -p layer-android --lib 2>&1 | tee artifacts/release-tests/android-bridge.log
      - name: Command inventory regression tests
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --release -p layer-host --example inventory 2>&1 | tee artifacts/release-tests/inventory.log
          cargo run --locked --release -p layer-host --example inventory > artifacts/release-tests/inventory.json
          python3 apps/layer-apple/scripts/test-property-audit.py artifacts/release-tests/inventory.json 2>&1 | tee artifacts/release-tests/property-audit.log
      - name: Windows bridge lint
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p layer-windows --all-targets --no-deps -- -D warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: renderer-test-reports
          path: |
            artifacts/release-tests/*.log
            artifacts/release-tests/inventory.json
            artifacts/release-tests/webp/manifest.json
          if-no-files-found: error

  prediction:
    if: ${{ !inputs.windows-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          python3 -m pip install numpy
      - run: cargo test --locked -p layer-engine --features prediction-bench
      - run: cargo build --locked -p layer-engine --release --features prediction-bench --examples
      - run: python3 tools/prediction/replay-bank.py --bin-dir target/release/examples --output artifacts/release-tests/prediction --analyze --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: prediction-test-reports
          path: artifacts/release-tests/prediction
          if-no-files-found: warn

  arch:
    if: ${{ !inputs.windows-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: archlinux:base-devel
    env:
      CAPY_BUILD_JOBS: "2"
      CARGO_BUILD_JOBS: "2"
      CAPY_STORAGE_DIR: ${{ github.workspace }}/artifacts/release-tests/profile
    steps:
      - run: pacman -Syu --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tools/build/arch-setup.sh --noconfirm
      - run: python3 -m unittest discover -s apps/layer-linux/bench -p 'test_*.py'
      - run: |
          python3 -c 'import gi; gi.require_version("Xmlb", "2.0")'
          node --test apps/layer-linux/package.test.mjs
      - run: python3 tools/build/gtk-runtime/test-environment.py
      - run: python3 tools/build/gtk-runtime/test-configure.py
      - run: apps/layer-linux/run.sh --help
      - run: python3 tools/build/gtk-runtime/test-runtime.py target/gtk-runtime/prefix target/gtk-runtime/gtk-4.24.1/subprojects
      - run: python3 tools/build/gtk-runtime/test-tablet-entry.py target/gtk-runtime/gtk-4.24.1
      - run: python3 tools/build/gtk-runtime/test-pad-focus.py target/gtk-runtime/gtk-4.24.1
      - run: LD_LIBRARY_PATH="$PWD/target/gtk-runtime/prefix/lib" cargo test --locked -p layer-linux --lib
      - name: Independent ICC and JPEG references
        env:
          LAYER_TEST_WORKING_PROFILES: /usr/share/color/icc/colord
          LAYER_TEST_CMYK_PROFILE: /usr/share/color/icc/colord/FOGRA39L_coated.icc
          LAYER_TEST_CMYK_REFERENCE: ${{ github.workspace }}/artifacts/release-tests/color/cmyk
          LAYER_TEST_JPEG_FIXTURES: ${{ github.workspace }}/artifacts/release-tests/color/jpeg
          LAYER_PROOF_REFERENCE: ${{ github.workspace }}/artifacts/release-tests/color/proof
        run: |
          CAPY_COLOR="$PWD/artifacts/release-tests/color"
          CAPY_LCMS_REVISION=6a5a89058cc0ef7e700c849d71a447e17fd07086
          mkdir -p "$CAPY_COLOR/lcms-source"
          git -C "$CAPY_COLOR/lcms-source" init --quiet
          git -C "$CAPY_COLOR/lcms-source" fetch --quiet --depth 1 https://github.com/mm2/Little-CMS.git "$CAPY_LCMS_REVISION"
          git -C "$CAPY_COLOR/lcms-source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$CAPY_COLOR/lcms-source" rev-parse HEAD)" = "$CAPY_LCMS_REVISION"
          git -C "$CAPY_COLOR/lcms-source" log -1 --format='%H%n%cs%n%s' | tee "$CAPY_COLOR/lcms-source.log"
          meson setup "$CAPY_COLOR/lcms-build" "$CAPY_COLOR/lcms-source" --prefix "$CAPY_COLOR/lcms" --libdir lib \
            --buildtype release --default-library shared -Dtests=disabled -Dutils=false -Djpeg=disabled -Dtiff=disabled -Dfastfloat=false -Dthreaded=false
          meson compile -C "$CAPY_COLOR/lcms-build" -j 2
          meson install -C "$CAPY_COLOR/lcms-build"
          export LD_LIBRARY_PATH="$CAPY_COLOR/lcms/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 tools/validation/icc_reference.py "$LAYER_TEST_CMYK_PROFILE" "$LAYER_TEST_CMYK_REFERENCE"
          python3 tools/validation/jpeg_interchange.py prepare "$LAYER_TEST_JPEG_FIXTURES" --cmyk-profile "$LAYER_TEST_CMYK_PROFILE" --rgb-profile "$LAYER_TEST_WORKING_PROFILES/sRGB.icc"
          cargo run --locked --release -p layer-color --example proof_profiles -- artifacts/release-tests/color/working
          python3 tools/validation/proof_synthetic.py artifacts/release-tests/color/synthetic
          python3 tools/validation/proof_reference.py artifacts/release-tests/color/working "$LAYER_PROOF_REFERENCE" \
            --target artifacts/release-tests/color/synthetic/matrix-v2.icc \
            --target artifacts/release-tests/color/synthetic/mft1-xyz.icc \
            --target artifacts/release-tests/color/synthetic/mft2-xyz.icc \
            --target artifacts/release-tests/color/synthetic/mab-xyz.icc \
            --target "$LAYER_TEST_CMYK_PROFILE"
          cargo test --locked --release -p layer-color --lib -- \
            icc::description::tests::installed_working_profile_suggestions \
            icc::output::tests::cmyk_output_matches_independent_reference_samples \
            icc::proof::tests::proof_matches_independent_cmm \
            photo::jpeg_tests::external_cmyk_jpeg_variants_match_reference_ink_samples \
            photo::jpeg_tests::external_progressive_and_oriented_jpeg_match_reference_samples_and_budget \
            --ignored --nocapture 2>&1 | tee artifacts/release-tests/color/color.log
          python3 tools/validation/jpeg_interchange.py verify "$LAYER_TEST_JPEG_FIXTURES"
      - run: CARGO_NET_OFFLINE=true apps/layer-linux/run.sh --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: color-reference-test-reports
          path: |
            artifacts/release-tests/color/**/*.json
            artifacts/release-tests/color/*.log
          if-no-files-found: warn

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - architecture: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: git rev-parse HEAD
      - run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy --target ${{ matrix.target }}
          rustup default $env:RUST_VERSION
      - name: Windows script regressions
        timeout-minutes: 5
        run: |
          ./apps/layer-windows/tests/script-encoding.ps1
          ./apps/layer-windows/tests/architecture.ps1
          ./apps/layer-windows/tests/application-menu.ps1
          ./apps/layer-windows/tests/application-menu-query.ps1
          ./apps/layer-windows/tests/model-snapshot-reader.ps1
          ./apps/layer-windows/tests/fixture-owner-census.ps1 -Helper apps/layer-windows/scripts/CapyUia.ps1 -Output artifacts/windows/fixture-owner-census-ci
      - name: Native Windows build and tests
        run: |
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          $env:RUST_BACKTRACE = 'full'
          $launch = @{
            FilePath = (Get-Process -Id $PID).Path
            WorkingDirectory = $env:GITHUB_WORKSPACE
            ArgumentList = @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File','apps/layer-windows/scripts/test-without-gpu.ps1','-Architecture','${{ matrix.architecture }}')
            PassThru = $true
            WindowStyle = 'Hidden'
            RedirectStandardOutput = 'artifacts/windows/test-stdout.log'
            RedirectStandardError = 'artifacts/windows/test-stderr.log'
          }
          $testProcess = Start-Process @launch
          $null = $testProcess.Handle
          $testProcess.WaitForExit()
          Get-Content artifacts/windows/test-stdout.log
          Get-Content artifacts/windows/test-stderr.log
          if ($testProcess.ExitCode -ne 0) { throw "Windows tests exited $($testProcess.ExitCode)" }
      - run: cargo clippy --locked --target ${{ matrix.target }} -p layer-windows --all-targets --no-deps -- -D warnings
      - name: Preserve native crash events
        if: failure()
        run: |
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          $events = @(Get-WinEvent -FilterHashtable @{LogName='Application';Id=1000,1001;StartTime=(Get-Date).AddHours(-2)} -ErrorAction SilentlyContinue)
          ConvertTo-Json -InputObject @($events | Select-Object TimeCreated,Id,ProviderName,Message) -Depth 4 |
            Set-Content -Encoding utf8 artifacts/windows/crash-events.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-${{ matrix.architecture }}-test-reports
          path: |
            artifacts/windows/**/*.log
            artifacts/windows/crash-events.json
            artifacts/windows/model-snapshot-*/result.json
          if-no-files-found: warn

  apple:
    if: ${{ !inputs.windows-only }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-darwin --target aarch64-apple-ios-sim
          rustup default "$RUST_VERSION"
      - name: Build iPad simulator and its XCTest bundle
        run: bash apps/layer-apple/scripts/build.sh simulator build-for-testing
      - name: Swift tests without Metal surfaces
        run: bash apps/layer-apple/scripts/test-without-gpu.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: apple-test-reports
          path: artifacts/release-tests/apple
          if-no-files-found: warn
