[package]
name = "layer-core"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Portable document model, edits and project format for Capy Canvas"
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
test-support = []
software-adapter-tests = []

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
# Bounded tile blocks; safe Rust with no frame or native dependencies.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
sha2 = "=0.11.0"
half = "=2.7.1"
crc32fast = "=1.5.1"
flate2.workspace = true
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
uuid = { version = "=1.26.1", features = ["v4", "js"] }
png = "=0.18.1"
web-time = "1.1.0"

[target.'cfg(all(not(target_arch = "wasm32"), not(any(target_os = "linux", target_os = "android", target_os = "windows")), any(not(target_os = "ios"), target_env = "sim")))'.dependencies]
sysinfo = { version = "=0.37.2", default-features = false, features = ["system", "apple-sandbox"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pollster = "0.4"
