[package]
name = "layer-core"
version = "0.1.0"
edition = "2024"
description = "Portable document model, edits and project format for Capy Canvas"
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Bounded tile blocks; safe Rust with no frame or native dependencies.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
sha2 = "=0.11.0"
half = "=2.7.1"
crc32fast = "=1.5.1"
flate2 = "1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
uuid = { version = "=1.26.1", features = ["v4", "js"] }
png = "=0.18.1"
