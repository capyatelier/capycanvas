[package]
name = "layer-core"
version = "0.1.0"
edition = "2024"
description = "Portable document and AI request model for Layer Copilot"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Bounded tile blocks; safe Rust with no frame or native dependencies.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
sha2 = "=0.11.0"
half = "=2.7.1"
