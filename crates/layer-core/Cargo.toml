[package]
name = "layer-core"
version = "0.1.0"
edition = "2024"
description = "Portable document and AI request model for Layer Copilot"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
zstd = { version = "0.13.3", default-features = false }
sha2 = "0.10"
