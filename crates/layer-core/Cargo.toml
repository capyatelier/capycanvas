[package]
name = "layer-core"
version = "0.1.0"
edition = "2024"
description = "Portable document and AI request model for Layer Copilot"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Safe Rust Zstd; leaf versions pin the reviewed encoder patch and frame API.
zrip-core = { version = "=0.10.1", default-features = false, features = ["std", "paranoid"] }
zrip-encode = { version = "=0.8.7", default-features = false, features = ["std", "paranoid"] }
zrip-decode = { version = "=0.8.7", default-features = false, features = ["std", "paranoid"] }
sha2 = "=0.11.0"
half = "=2.7.1"
