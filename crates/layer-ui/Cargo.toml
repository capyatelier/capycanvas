[package]
name = "layer-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Portable workspace layout, UI state, actions, and canvas interaction"

[dependencies]
fluent-bundle = "0.16"
unic-langid = "0.9"
unicode-normalization = "0.1"
sha2 = "0.10"
layer-color = { path = "../layer-color" }
layer-core = { path = "../layer-core" }
layer-engine = { path = "../layer-engine" }
layer-render = { path = "../layer-render" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
fasteval = { version = "0.2.4", default-features = false }
flate2.workspace = true
quick-xml = "=0.41.0"

[build-dependencies]
fluent-syntax = "0.12"

[dev-dependencies]
fluent-syntax = "0.12"
layer-core = { path = "../layer-core", features = ["test-support"] }
