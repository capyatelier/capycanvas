[package]
name = "layer-host"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
layer-color = { path = "../layer-color" }
layer-core = { path = "../layer-core" }
layer-engine = { path = "../layer-engine" }
layer-render = { path = "../layer-render" }
layer-render-wgpu = { path = "../layer-render-wgpu" }
layer-ui = { path = "../layer-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
wgpu.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
layer-core = { path = "../layer-core", features = ["test-support"] }
pollster = "0.4"
