[package]
name = "layer-workspace"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared workspace records, management policy and asynchronous persistence"

[[example]]
name = "check-saved-data"
required-features = ["native"]

[features]
native = ["dep:rusqlite", "dep:async-channel", "dep:libc", "dep:layer-host"]

[dependencies]
layer-ui = { path = "../layer-ui" }
layer-core = { path = "../layer-core" }
layer-render = { path = "../layer-render" }
layer-host = { path = "../layer-host", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
uuid = { version = "1", features = ["v4", "js"] }
async-channel = { version = "2", optional = true }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "limits"], optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.40.2", features = ["backup", "limits"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
pollster = "0.4"
