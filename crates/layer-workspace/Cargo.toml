[package]
name = "layer-workspace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared workspace records, management policy and asynchronous persistence"

[features]
native = ["dep:rusqlite", "dep:async-channel"]

[dependencies]
layer-ui = { path = "../layer-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "js"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"], optional = true }
async-channel = { version = "2", optional = true }

[dev-dependencies]
pollster = "0.4"
