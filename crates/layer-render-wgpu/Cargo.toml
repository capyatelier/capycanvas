[package]
name = "layer-render-wgpu"
version = "0.1.0"
edition = "2024"
description = "GPU-resident wgpu raster backend for Layer"
license.workspace = true

[dependencies]
layer-core = { path = "../layer-core" }
layer-color = { path = "../layer-color" }
layer-render = { path = "../layer-render" }
pollster = "0.4.0"
wgpu = "30.0.1"
naga = { version = "30.0.0", features = ["wgsl-in"] }
web-time = "1.1.0"
png = "0.17.16"
crc32fast = "1.5"

[dev-dependencies]
layer-engine = { path = "../layer-engine" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
ash = { version = "0.38.0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.78"
futures-channel = "0.3"

[lib]
path = "src/lib.rs"
